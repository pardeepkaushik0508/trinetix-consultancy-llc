name: Deploy Trinetix WordPress Theme

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: trinetix-production-deploy
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: PHP syntax validation
        shell: bash
        run: |
          set -e
          echo "Checking PHP syntax..."
          find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          echo "PHP syntax validation passed."

    - name: Configure SSH
  shell: bash
  run: |
    set -e

    mkdir -p ~/.ssh
    chmod 700 ~/.ssh

    printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/id_ed25519
    chmod 600 ~/.ssh/id_ed25519

    printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
    chmod 600 ~/.ssh/known_hosts

    ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
    echo "SSH key is valid"

      - name: Test SSH connection
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.VPS_PORT }}" \
            -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Deploy theme
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

          set -e

          THEME_DIR="/var/www/trinetix-consultancy-llc/wp-content/themes/trinetix-consultancy-llc"

          echo "========================================"
          echo "Starting Trinetix deployment"
          echo "========================================"

          cd "$THEME_DIR"

          echo "Current commit:"
          git log -1 --oneline

          echo "Fetching latest code..."
          git fetch origin main

          echo "Switching to main..."
          git checkout main

          echo "Pulling latest commit..."
          git pull --ff-only origin main

          echo "Running PHP syntax validation on server..."
          find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l

          echo "New deployed commit:"
          git log -1 --oneline

          echo "========================================"
          echo "Deployment successful"
          echo "========================================"

          EOF